# Deterministic early-boot image for the Alienware 15 R1.
hostonly="no"
hostonly_cmdline="no"
hostonly_i18n="no"
do_strip="yes"

# Override Bazzite's late 99-nvidia.conf and its generic VFIO preload.
force_drivers=""

# Removable LUKS key device and storage/display hardware used by this machine.
force_drivers+=" xhci_pci usb_storage uas "
add_drivers+=" i915 ehci_pci ahci sd_mod "

# NVIDIA is available after switch-root and is unnecessary in early boot.
omit_drivers+=" nvidia nvidia_drm nvidia_modeset nvidia_uvm nouveau amdgpu "

# Complete encrypted Btrfs root stack.
force_add_dracutmodules+=" crypt dm systemd-cryptsetup rootfs-block "
